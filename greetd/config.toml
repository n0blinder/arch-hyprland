[terminal]
vt = 1

[default_session]
# No --cmd: tuigreet lists the wayland-sessions and --remember-session
# keeps your pick ("Hyprland"). Launches the distro session directly.
command = "tuigreet --remember --remember-session --asterisks --width 60 --theme 'border=magenta;text=cyan;prompt=green;time=red;action=blue;button=yellow;container=black;input=red'"
user = "greeter"